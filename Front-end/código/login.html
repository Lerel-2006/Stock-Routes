<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login</title>
</head>
<body>
  <h1>Login</h1>

  <form id="form-login" action="#" method="post">
    <p>
      <label for="login-email">E-mail</label><br>
      <input type="email" id="login-email" name="email" required autocomplete="username">
    </p>
    <p>
      <label for="login-senha">Senha</label><br>
      <input type="password" id="login-senha" name="senha" required autocomplete="current-password">
    </p>
    <p>
      <button type="submit">Entrar</button>
    </p>
  </form>

  <p id="login-erro" role="alert"></p>
  <p id="login-sucesso" role="status"></p>

  <p>
    Caso não tenha login
    <a href="cadastro.html">Cadastre-se aqui</a>
  </p>
  
</body>
</html>
